<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#f7f8f3">
<title>FluentForge — 项目协调与网页开发助手</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Manrope:wght@400;500;600;700;800&display=swap');
:root{--paper:#f7f8f3;--ink:#192520;--muted:#65736b;--line:#dce3da;--green:#1c5d46;--lime:#d6f36a;--mint:#e8f1e8;--orange:#ef9c67;--white:#fff;--shadow:0 24px 70px rgba(26,55,40,.09)}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--paper);color:var(--ink);font-family:Manrope,system-ui,sans-serif}a{color:inherit;text-decoration:none}.wrap{width:min(1160px,calc(100% - 48px));margin:auto}.mono{font-family:'DM Mono',monospace;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
header{height:78px;display:flex;align-items:center;border-bottom:1px solid var(--line)}.nav{display:flex;align-items:center;justify-content:space-between}.brand{display:flex;align-items:center;gap:11px;font-weight:800;font-size:18px;letter-spacing:-.04em}.brandmark{width:34px;height:34px;border-radius:11px;background:var(--green);color:var(--lime);display:grid;place-items:center;font-size:18px}.navlinks{display:flex;gap:30px;font-size:13px;color:var(--muted)}.navlinks a:hover{color:var(--green)}.nav-cta{background:var(--ink);color:white;border-radius:999px;padding:12px 18px;font-size:12px;font-weight:700}
.hero{padding:86px 0 74px;display:grid;grid-template-columns:1.1fr .9fr;gap:56px;align-items:center}.eyebrow{display:flex;align-items:center;gap:10px;margin-bottom:24px}.pulse{width:8px;height:8px;border-radius:100%;background:#78aa73;box-shadow:0 0 0 5px #78aa7324}.hero h1{font-size:clamp(48px,7vw,82px);line-height:.99;letter-spacing:-.075em;margin:0 0 25px;font-weight:700}.hero h1 em{font-style:normal;color:var(--green)}.intro{font-size:17px;line-height:1.8;color:#53625a;max-width:590px}.actions{display:flex;gap:12px;margin-top:31px;align-items:center}.button{padding:15px 20px;border-radius:999px;background:var(--green);color:white;font-size:13px;font-weight:700;display:inline-flex;align-items:center;gap:10px}.button:hover{background:#124a37}.button.secondary{background:transparent;color:var(--ink);border:1px solid var(--line)}.tiny{font-size:11px;color:var(--muted);margin-top:20px}
.preview{background:#17241f;border-radius:24px;padding:22px;color:#eef4ed;box-shadow:var(--shadow);transform:rotate(1deg);position:relative;overflow:hidden}.preview:before{content:'';position:absolute;width:220px;height:220px;border-radius:50%;background:#c5ea6830;filter:blur(65px);right:-70px;top:-80px}.windowbar{display:flex;justify-content:space-between;align-items:center;position:relative}.dots{display:flex;gap:5px}.dots i{width:7px;height:7px;background:#718178;border-radius:50%}.live{font:10px 'DM Mono';color:#c9e77e}.tasktop{margin:31px 0 16px;display:flex;justify-content:space-between;align-items:end;position:relative}.tasktop h3{font-size:20px;margin:7px 0 0;letter-spacing:-.04em}.taskdate{font:11px 'DM Mono';color:#a1afa5}.tasks{display:grid;gap:9px;position:relative}.task{background:#22332b;border:1px solid #34473c;border-radius:12px;padding:13px 14px;display:grid;grid-template-columns:27px 1fr auto;align-items:center;gap:10px}.check{width:20px;height:20px;border:1px solid #637469;border-radius:6px}.check.done{background:var(--lime);border-color:var(--lime);color:#203328;display:grid;place-items:center;font-size:12px}.taskname{font-size:12px;font-weight:700}.taskmeta{font:9px 'DM Mono';color:#a6b3aa;margin-top:5px}.tag{font:9px 'DM Mono';padding:5px 7px;border-radius:6px;background:#344c3c;color:#d7f184}.tag.p1{background:#4e3d2d;color:#ffc28e}.progress-row{display:flex;justify-content:space-between;margin-top:19px;font-size:10px;color:#a6b3aa;position:relative}.progress{height:5px;background:#34453b;border-radius:8px;margin-top:8px;overflow:hidden;position:relative}.progress span{display:block;width:62%;height:100%;background:var(--lime);border-radius:8px}.next{margin-top:17px;background:#d5ef75;color:#1e3025;padding:12px;border-radius:10px;font-size:10px;font-weight:700;position:relative}.next span{font-family:'DM Mono';font-size:9px;display:block;margin-bottom:5px;opacity:.7}
.stats{display:grid;grid-template-columns:repeat(3,1fr);border-top:1px solid var(--line);border-bottom:1px solid var(--line);padding:23px 0;margin-bottom:90px}.stat{padding:0 25px;border-right:1px solid var(--line)}.stat:first-child{padding-left:0}.stat:last-child{border:0}.stat strong{font-size:17px;letter-spacing:-.04em}.stat p{font-size:11px;color:var(--muted);margin:5px 0 0}
section{padding:24px 0 78px}.section-head{display:flex;justify-content:space-between;align-items:end;margin-bottom:34px}.section-head h2{font-size:40px;letter-spacing:-.065em;margin:9px 0 0;line-height:1.1}.section-head p{max-width:340px;color:var(--muted);font-size:13px;line-height:1.7;margin:0}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;background:var(--line);border:1px solid var(--line);border-radius:18px;overflow:hidden}.feature{background:var(--paper);padding:24px;min-height:183px}.icon{width:38px;height:38px;border-radius:12px;background:var(--mint);display:grid;place-items:center;color:var(--green);font-size:17px;margin-bottom:21px}.feature h3{font-size:14px;margin:0 0 8px;letter-spacing:-.03em}.feature p{font-size:11px;line-height:1.7;color:var(--muted);margin:0}
.flow{display:grid;grid-template-columns:.85fr 1.15fr;gap:70px;align-items:start;background:#eaf0e7;border-radius:24px;padding:42px;margin:12px 0 85px}.flow h2{font-size:38px;line-height:1.08;letter-spacing:-.065em;margin:10px 0 15px}.flow .lead{font-size:13px;line-height:1.8;color:#596a60}.steps{display:grid;gap:0}.step{display:grid;grid-template-columns:38px 1fr;gap:12px;border-bottom:1px solid #d3ddd2;padding:12px 0}.step:last-child{border:0}.num{font:11px 'DM Mono';color:#77887c;padding-top:2px}.step b{font-size:12px}.step p{margin:4px 0 0;color:var(--muted);font-size:11px;line-height:1.6}
.sample{border:1px solid var(--line);border-radius:17px;overflow:hidden;margin-bottom:80px}.sample-title{display:flex;justify-content:space-between;align-items:center;padding:20px 22px;border-bottom:1px solid var(--line)}.sample-title h3{font-size:15px;margin:0}.sample-title span{font:10px 'DM Mono';color:var(--muted)}table{width:100%;border-collapse:collapse;text-align:left}th{font:10px 'DM Mono';letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:400;background:#f0f2ec}td,th{padding:14px 17px;border-bottom:1px solid var(--line);font-size:11px}tr:last-child td{border:0}.priority{display:inline-block;padding:5px 8px;border-radius:6px;font:9px 'DM Mono';background:#f8e4d3;color:#924f26}.priority.p0{background:#e4f1b5;color:#44601b}.state{color:var(--muted)}
.guard{display:grid;grid-template-columns:1fr 1fr;gap:28px;margin-bottom:82px}.guardbox{padding:25px;border-radius:16px;background:#edf4e9}.guardbox.no{background:#f4eee8}.guardbox h3{font-size:14px;margin:0 0 16px}.guardbox ul{margin:0;padding:0;list-style:none;display:grid;gap:11px}.guardbox li{font-size:11px;line-height:1.6;color:#59675f;display:flex;gap:9px}.yes{color:var(--green);font-weight:800}.nope{color:#a55a35;font-weight:800}
.final{background:var(--green);color:white;border-radius:24px;padding:39px;display:flex;align-items:center;justify-content:space-between;margin-bottom:78px}.final h2{font-size:30px;letter-spacing:-.06em;margin:9px 0}.final p{font-size:12px;color:#c6d7c8;margin:0}.final .button{background:var(--lime);color:#1b3024}.final .mono{color:#c6d7c8}footer{border-top:1px solid var(--line);padding:23px 0 34px;display:flex;justify-content:space-between;color:var(--muted);font-size:10px}
@media(max-width:850px){.hero{grid-template-columns:1fr;gap:38px;padding-top:60px}.preview{max-width:570px}.grid{grid-template-columns:repeat(2,1fr)}.flow{grid-template-columns:1fr;gap:22px}.section-head{align-items:start;gap:20px;flex-direction:column}.stats{margin-bottom:60px}}@media(max-width:560px){.wrap{width:calc(100% - 32px)}header{height:66px}.navlinks{display:none}.hero{padding:52px 0}.hero h1{font-size:54px}.intro{font-size:14px}.actions{align-items:stretch;flex-direction:column}.actions .button{justify-content:center}.stats{grid-template-columns:1fr;gap:15px;padding:19px 0}.stat,.stat:first-child{padding:0;border:0}.grid{grid-template-columns:1fr}.feature{min-height:auto}.flow{padding:25px}.flow h2{font-size:32px}.sample{overflow-x:auto}table{min-width:600px}.guard{grid-template-columns:1fr}.final{padding:27px;display:grid;gap:22px}.final h2{font-size:25px}footer{gap:12px;flex-direction:column}}
</style>
</head>
<body>
<header><div class="wrap nav"><a class="brand" href="#top"><span class="brandmark">F</span>FluentForge</a><nav class="navlinks"><a href="#capabilities">能力</a><a href="#workflow">流程</a><a href="#boundaries">原则</a></nav><a class="nav-cta" href="#start">开始 →</a></div></header>
<main class="wrap" id="top">
<div class="hero"><div><div class="eyebrow"><i class="pulse"></i><span class="mono">个人 AI 项目伙伴</span></div><h1>让构想落地，<br><em>让开发有序。</em></h1><p class="intro"><b>FluentForge</b> 是 Thịnh 的项目协调与网页开发助手——将零散想法整理成清晰计划，拆分为专注工作时段，让项目持续向前。</p><div class="actions"><a class="button" href="#workflow">了解工作流程 <span>↗</span></a><a class="button secondary" href="#capabilities">查看能力</a></div><p class="tiny">专注互动英语学习网站 · 先完成 MVP，再逐步完善</p></div>
<div class="preview" aria-label="工作计划预览"><div class="windowbar"><div class="dots"><i></i><i></i><i></i></div><span class="live">● 今日计划</span></div><div class="tasktop"><div><div class="mono" style="color:#a6b3aa">星期二 · 第 04 轮迭代</div><h3>今天要推进什么？</h3></div><span class="taskdate">3 项任务</span></div><div class="tasks"><div class="task"><div class="check done">✓</div><div><div class="taskname">确定课程数据结构</div><div class="taskmeta">逻辑 · 35 分钟</div></div><span class="tag">P0</span></div><div class="task"><div class="check"></div><div><div class="taskname">搭建闪卡组件</div><div class="taskmeta">前端 · 50 分钟</div></div><span class="tag">P0</span></div><div class="task"><div class="check"></div><div><div class="taskname">添加卡片翻转效果</div><div class="taskmeta">界面设计 · 30 分钟</div></div><span class="tag p1">P1</span></div></div><div class="progress-row"><span>今日进度</span><span>已完成 1 / 3</span></div><div class="progress"><span></span></div><div class="next"><span>未来 5 分钟内可以开始的事</span>打开课程结构文件，确认所需的数据字段 →</div></div></div>
<div class="stats"><div class="stat"><strong>30–60 分钟</strong><p>每个专注工作时段</p></div><div class="stat"><strong>优先完成 MVP</strong><p>核心功能始终优先</p></div><div class="stat"><strong>三个计划周期</strong><p>里程碑 · 迭代 · 每日计划</p></div></div>
<section id="capabilities"><div class="section-head"><div><div class="mono">01 / 能力</div><h2>从待办列表，<br>到下一步行动。</h2></div><p>FluentForge 结合英语学习产品的开发场景与 Thịnh 的课程安排，组织和推进各项工作。</p></div><div class="grid"><article class="feature"><div class="icon">◈</div><h3>项目协调</h3><p>跟踪项目里程碑、每周迭代与每日任务，梳理不同工作分支及其依赖关系。</p></article><article class="feature"><div class="icon">⌘</div><h3>网页开发</h3><p>按界面设计、前端、逻辑与 AI、课程内容分类，让每项任务各有归属。</p></article><article class="feature"><div class="icon">▤</div><h3>梳理待办列表</h3><p>发现重复任务与阻塞项，确认截止日期，并将大任务拆分为 30–60 分钟的专注时段。</p></article><article class="feature"><div class="icon">↗</div><h3>保持项目进度</h3><p>进度落后时，建议调整安排并精简非核心内容，以保障 MVP 与整体期限。</p></article></div></section>
<div class="flow" id="workflow"><div><div class="mono">02 / 工作流程</div><h2>清晰、务实的<br>工作流程。</h2><p class="lead">无论是快速笔记、聊天中的想法还是需求文档，FluentForge 都会整理出足够具体、可以开始执行的方案。</p></div><div class="steps"><div class="step"><span class="num">01</span><div><b>分类与关联</b><p>按模块整理任务，找出重复事项与技术依赖。</p></div></div><div class="step"><span class="num">02</span><div><b>识别阻塞项并排序</b><p>先处理解锁后续工作的事项，再做核心功能；动效与游戏化功能排在后面。</p></div></div><div class="step"><span class="num">03</span><div><b>拆分任务并估时</b><p>拆分为 30–60 分钟的专注时段，并为每段明确完成标准与下一步行动。</p></div></div><div class="step"><span class="num">04</span><div><b>制定可执行计划</b><p>结合课程安排、空闲时间与截止日期；信息不足时说明假设。</p></div></div><div class="step"><span class="num">05</span><div><b>按需调整</b><p>将未完成任务移至下一个空闲时段，保留核心功能；更改固定里程碑前先征求确认。</p></div></div></div></div>
<section><div class="section-head"><div><div class="mono">03 / 输出</div><h2>拿到计划，<br>马上开始行动。</h2></div><p>每项任务都包含优先级、预计时长、状态和下一步行动，而不只是长长的任务清单。</p></div><div class="sample"><div class="sample-title"><h3>本周迭代计划</h3><span>DEMO PLAN · 3 项任务</span></div><table><thead><tr><th>任务</th><th>模块</th><th>优先级</th><th>预计时长</th><th>下一步行动</th><th>状态</th></tr></thead><tbody><tr><td>确定课程数据结构</td><td>逻辑</td><td><span class="priority p0">P0</span></td><td>35 分钟</td><td>确认数据结构</td><td class="state">进行中</td></tr><tr><td>搭建闪卡组件</td><td>前端</td><td><span class="priority p0">P0</span></td><td>50 分钟</td><td>创建基础组件</td><td class="state">未开始</td></tr><tr><td>添加卡片翻转效果</td><td>界面设计</td><td><span class="priority">P1</span></td><td>30 分钟</td><td>确定交互状态</td><td class="state">待办</td></tr></tbody></table></div></section>
<section id="boundaries"><div class="section-head"><div><div class="mono">04 / 自主权限</div><h2>主动提供支持。<br>最终决定由 Thịnh 做出。</h2></div></div><div class="guard"><div class="guardbox"><h3><span class="yes">✓</span> FluentForge 可以</h3><ul><li><span class="yes">+</span> 整理并拆分任务，提出临时计划。</li><li><span class="yes">+</span> 信息不足时明确说明假设，并提出 1–2 个简短问题。</li><li><span class="yes">+</span> 进度落后时，建议调整 MVP 范围。</li></ul></div><div class="guardbox no"><h3><span class="nope">!</span> FluentForge 必须先征求确认</h3><ul><li><span class="nope">−</span> 从待办列表删除任务，或更改网站核心结构。</li><li><span class="nope">−</span> 推迟固定截止日期，或更改已确认的里程碑。</li><li><span class="nope">−</span> 不索要或保存密码、真实 API 密钥或个人财务信息。</li></ul></div></div></section>
<div class="final" id="start"><div><div class="mono">准备就绪，随时开始</div><h2>你的下一个想法是什么？</h2><p>发送零散笔记，FluentForge 帮你找到切入点。</p></div><a href="#top" class="button">开始制定计划 <span>↑</span></a></div>
</main><footer class="wrap"><span>FluentForge · Thịnh 的项目协调助手</span><span>清晰规划 · 动手学习</span></footer>
</body></html>
